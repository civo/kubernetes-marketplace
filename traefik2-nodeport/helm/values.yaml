# Values used to render app.yaml from the upstream Traefik Helm chart.
# Regenerate with ./helm/render.sh after changing this file or the chart version.
image:
  registry: docker.io
  repository: traefik
  tag: v2.11.61

deployment:
  kind: DaemonSet

# Bind 80/443 directly on every node instead of using a Service.
hostNetwork: true
service:
  enabled: false

ports:
  traefik:
    port: 9000
    hostPort: 9000
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    hostPort: 443
  metrics:
    # Kept off 9100 so it does not clash with node-exporter.
    port: 9910
    hostPort: 9910

# Root is needed to bind <1024 on the host network.
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: false
  runAsUser: 0

# Do not publish the dashboard: with hostNetwork the traefik entrypoint is
# reachable on every node's public IP.
ingressRoute:
  dashboard:
    enabled: false

ingressClass:
  enabled: true
  isDefaultClass: true

additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.hostname=${CLUSTER_ID}.k8s.civo.com

priorityClassName: system-cluster-critical
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# hostNetwork pods cannot surge: the new pod would clash on the same ports.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Container runs as root (above); keep the pod-level context consistent.
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: null
  runAsNonRoot: null
  runAsUser: null
