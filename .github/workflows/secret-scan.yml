---
name: "Secret scan"

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan the files for committed secrets
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 detect \
            --source /repo --no-git --redact --verbose --config /repo/.gitleaks.toml
